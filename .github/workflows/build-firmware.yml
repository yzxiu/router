name: build-firmware

# 主流水线: 用 ImmortalWrt 官方源码编译多机型完整可刷固件
# 四平台(mt3000/tr3000/x86-64/lubancat) 用 matrix 并发编译
# 阶段2: 官方纯净默认 config, 各出完整包
# 阶段3: lubancat = armsr/armv8 编 LubanCat rootfs (后续 ophub 封装成 .img)
# 上游版本(tag) 参数化, 默认 v25.12.2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ImmortalWrt tag/branch to build'
        required: true
        type: string
        default: 'v25.12.2'
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [mt3000, tr3000, x86-64, lubancat]
    steps:
      - name: Checkout router repo
        uses: actions/checkout@v4

      - name: Set device
        id: dev
        run: |
          DEV="${{ matrix.device }}"
          echo "DEVICE=${DEV}" >> "$GITHUB_OUTPUT"
          if [ -f "config/${DEV}.config" ]; then
            echo "HAS_CONFIG=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CONFIG=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone ImmortalWrt source
        run: |
          TAG="${{ github.event.inputs.tag || 'v25.12.2' }}"
          git clone --depth 1 --branch "${TAG}" https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "Cloned ImmortalWrt at ${TAG} for ${{ steps.dev.outputs.DEVICE }}"

      - name: Setup feeds
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE"/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate device config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE"/scripts/generate-config.sh "${{ steps.dev.outputs.DEVICE }}" "${{ steps.dev.outputs.HAS_CONFIG }}"

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make -j"$(nproc)" V=s

      # 阶段3: LubanCat 专用封装 — 用官方 armsr rootfs + ophub remake 封装成可刷 .img
      - name: Package LubanCat-1 image (ophub remake)
        if: steps.dev.outputs.DEVICE == 'lubancat'
        run: |
          set -euo pipefail
          # 确保封装依赖 (parted/mkfs.btrfs/mkfs.vfat/mkfs.ext4 等)
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs parted dosfstools e2fsprogs >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          ROOTFS="$(find openwrt/bin/targets/armsr -name '*rootfs.tar.gz' | head -1)"
          echo "Using rootfs: ${ROOTFS}"
          mkdir -p ophub/openwrt-armsr
          cp "${ROOTFS}" ophub/openwrt-armsr/
          cd ophub
          sudo ./remake -b lubancat-1 -k 6.18.y
          echo "--- packaged ---"
          ls -lh openwrt/out/

      - name: Collect artifacts
        id: artifacts
        run: |
          cd openwrt
          DEVICE="${{ steps.dev.outputs.DEVICE }}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/targets -type f \( -name '*.bin' -o -name '*.img.gz' -o -name '*rootfs.tar.gz' \) -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          if [ "${DEVICE}" = "lubancat" ]; then
            # ophub 封装出的可刷 .img
            cp "$GITHUB_WORKSPACE"/ophub/openwrt/out/*.img "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          fi
          cd "$GITHUB_WORKSPACE"
          echo "FILES=$(ls artifacts | tr '\n' ',')" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.dev.outputs.DEVICE }}
          path: artifacts/
          if-no-files-found: error

  # 统一 Release: 汇总所有平台固件到同一个 release (参考 immutablewrt_yzx)
  release:
    needs: [build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate release tag
        id: tag
        run: |
          IMMORTALWRTTAG="${{ github.event.inputs.tag || 'v25.12.2' }}"
          BUILD_TAG="$(date +%Y%m%d-%H%M)"
          RELEASE_TAG="ImmortalWrt-${IMMORTALWRTTAG#v}-${BUILD_TAG}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${RELEASE_TAG}"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: ./all-firmware
          merge-multiple: false

      - name: Gather firmware files
        run: |
          mkdir -p release-files
          find ./all-firmware -type f \( -name '*.bin' -o -name '*.img.gz' -o -name '*.img' -o -name '*rootfs.tar.gz' \) | while read file; do
            cp "$file" release-files/
          done
          echo "=== 准备发布的固件列表 ==="
          ls -lh release-files/

      - name: Compute SHA256 checksums
        run: |
          cd release-files
          sha256sum * > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body: |
            ImmortalWrt 多机型固件统一发布。

            - 上游版本: `${{ github.event.inputs.tag || 'v25.12.2' }}`
            - 构建时间: `${{ steps.tag.outputs.release_tag }}`
            - 机型: mt3000 / tr3000 / x86-64 / lubancat-1
          files: release-files/*
