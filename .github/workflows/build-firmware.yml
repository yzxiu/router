name: build-firmware

# 主流水线: 用 ImmortalWrt 官方源码编译多机型完整可刷固件
# 三平台(mt3000/tr3000/x86-64) 用 matrix 并发编译
# 阶段2: 官方纯净默认 config, 各出完整包
# 上游版本(tag) 参数化, 默认 v25.12.2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ImmortalWrt tag/branch to build'
        required: true
        type: string
        default: 'v25.12.2'
  push:
    branches: [main]

jobs:
  build:
    name: build-${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: [mt3000, tr3000, x86-64]
    steps:
      - name: Checkout router repo
        uses: actions/checkout@v4

      - name: Set device
        id: dev
        run: |
          DEV="${{ matrix.device }}"
          echo "DEVICE=${DEV}" >> "$GITHUB_OUTPUT"
          if [ -f "config/${DEV}.config" ]; then
            echo "HAS_CONFIG=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CONFIG=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone ImmortalWrt source
        run: |
          TAG="${{ github.event.inputs.tag || 'v25.12.2' }}"
          git clone --depth 1 --branch "${TAG}" https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "Cloned ImmortalWrt at ${TAG} for ${{ steps.dev.outputs.DEVICE }}"

      - name: Setup feeds
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE"/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate device config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE"/scripts/generate-config.sh "${{ steps.dev.outputs.DEVICE }}" "${{ steps.dev.outputs.HAS_CONFIG }}"

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make -j"$(nproc)" V=s

      - name: Collect artifacts
        id: artifacts
        run: |
          cd openwrt
          DEVICE="${{ steps.dev.outputs.DEVICE }}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin/targets -type f \( -name '*.bin' -o -name '*.img.gz' \) -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          cd "$GITHUB_WORKSPACE"
          echo "FILES=$(ls artifacts | tr '\n' ',')" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.dev.outputs.DEVICE }}
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: firmware-${{ steps.dev.outputs.DEVICE }}-${{ github.run_number }}
          files: artifacts/*
