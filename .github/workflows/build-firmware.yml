name: build-firmware

# 主流水线: 用 ImmortalWrt 官方源码编译多机型完整可刷固件
# 平台(mt3000/tr3000/x86-64/lubancat/nanopi-r3s) 用 matrix 并发编译
# 阶段2: 官方纯净默认 config, 各出完整包
# 阶段3: lubancat = armsr/armv8 编 LubanCat rootfs (后续 ophub 封装成 .img)
# nanopi-r3s = 官方 rockchip/armv8 target 直接编译 (无需封装)
# 上游版本(tag) 参数化, 默认 v25.12.2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'ImmortalWrt tag/branch to build'
        required: true
        type: string
        default: 'v25.12.2'
  push:
    branches: ['v*']

permissions:
  contents: write

jobs:
  # 从 config/platforms.conf 生成编译矩阵 (设备列表 + 各自 runner)
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build matrix from platforms.conf
        id: gen
        run: |
          # platforms.conf: <device> <target> <subtarget> <profile> <runner>
          # 生成 JSON matrix: [{"device":..., "runner":...}, ...]
          matrix=$(awk '$1!~/^#/ && NF>=5 {printf "{\"device\":\"%s\",\"runner\":\"%s\"},", $1, $5}' config/platforms.conf)
          matrix="[${matrix%,}]"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}"

  build:
    name: build-${{ matrix.device }}
    needs: setup
    # runner 统一 ubuntu-24.04: 编译平台也用 24.04(与 LubanCat remake 封装所需
    # coreutils>=9.1 一致, 消除 22.04 的 8.32 限制; 交叉工具链由 OpenWrt 自己拉, 宿主无关)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout router repo
        uses: actions/checkout@v4

      - name: Set device
        id: dev
        run: |
          echo "DEVICE=${{ matrix.device }}" >> "$GITHUB_OUTPUT"

      - name: Clone ImmortalWrt source
        run: |
          TAG="${{ github.event.inputs.tag || 'v25.12.2' }}"
          git clone --depth 1 --branch "${TAG}" https://github.com/immortalwrt/immortalwrt.git openwrt
          echo "Cloned ImmortalWrt at ${TAG} for ${{ steps.dev.outputs.DEVICE }}"

      - name: Setup feeds
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE"/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate device config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE"/scripts/generate-config.sh "${{ steps.dev.outputs.DEVICE }}"

      - name: Build
        run: |
          cd openwrt
          # rockchip target 的 u-boot 需要 Python elftools 处理 ELF, ubuntu-24.04 默认未装 → prereq 失败
          # 统一安装(所有平台无害), 否则 rockchip(如 nanopi-r3s) 的 make 前置检查会报
          # "u-boot: Please install the Python3 elftools module"
          #   ⚠️ 包名是 python3-pyelftools(Python 模块名才是 elftools), 别写成 python3-elftools(apt 无此包会失败)
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq python3-pyelftools >/dev/null 2>&1
          python3 -c "import elftools; ok=1" 2>/dev/null || { echo "FATAL: python3-pyelftools 未装上"; exit 1; }
          make defconfig
          make -j"$(nproc)" V=s

      # 阶段3: LubanCat 专用封装 — 用官方 armsr rootfs + ophub remake 封装成可刷 .img
      - name: Package LubanCat-1 image (ophub remake)
        if: steps.dev.outputs.DEVICE == 'lubancat'
        run: |
          set -euo pipefail
          # 确保封装依赖 (parted/mkfs.btrfs/mkfs.vfat/mkfs.ext4 等)
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs parted dosfstools e2fsprogs device-tree-compiler >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          # 现场编译板级 overlay dts→dtbo (源码在 ophub/dts/, 产物生成到 ophub/{msata,fan}/ 供 remake 读取)
          #   msata: 关 pcie2x1/开 sata2/vcc3v3_pcie 常开/sdmmc0 限速 → SSD 出 /dev/sda
          #   fan:   使能 pwm0 → 供 fan-thermal 守护调速
          # 用 -@ (--symbols) 输出 __symbols__ 表, 供 U-Boot fdt apply 解析 overlay
          # 目标目录不入 git (含 gitignore 的 *.dtbo), 先 mkdir -p 确保存在
          mkdir -p ophub/msata ophub/fan
          dtc -@ -I dts -O dtb -o ophub/msata/lubancat-msata.dtbo ophub/dts/msata/lubancat-msata-overlay.dts
          dtc -@ -I dts -O dtb -o ophub/fan/lubancat-fan-pwm.dtbo ophub/dts/fan/lubancat-fan-pwm-overlay.dts
          ROOTFS="$(find openwrt/bin/targets/armsr -name '*rootfs.tar.gz' | head -1)"
          echo "Using rootfs: ${ROOTFS}"
          mkdir -p ophub/openwrt-armsr
          cp "${ROOTFS}" ophub/openwrt-armsr/
          cd ophub
          sudo ./remake -b lubancat-1 -k 6.18.y
          echo "--- packaged ---"
          ls -lh openwrt/out/

      # 归档: 按 yzx 风格, 精选关键固件 (供 release) + 完整 bin + 失败日志, 分三类 artifact
      - name: Collect firmware files
        id: artifacts
        run: |
          cd openwrt
          DEVICE="${{ steps.dev.outputs.DEVICE }}"
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          DEST="$GITHUB_WORKSPACE/firmware"
          case "${DEVICE}" in
            mt3000)
              cp bin/targets/mediatek/filogic/*glinet_gl-mt3000*squashfs-sysupgrade.bin "$DEST/" || exit 1
              ;;
            tr3000)
              cp bin/targets/mediatek/filogic/*cudy_tr3000-v1-ubootmod*squashfs-sysupgrade.itb "$DEST/" || exit 1
              ;;
            x86-64)
              cp bin/targets/x86/64/*squashfs-combined-efi.img.gz "$DEST/" || exit 1
              cp bin/targets/x86/64/*ext4-combined-efi.img.gz "$DEST/" || exit 1
              cp bin/targets/x86/64/*squashfs-rootfs.img.gz "$DEST/" || exit 1
              cp bin/targets/x86/64/*rootfs.tar.gz "$DEST/" || exit 1
              ;;
            lubancat)
              # remake 产物为 openwrt_*_rockchip_lubancat-1_k*.img.gz (remake 会 gzip 压缩)
              cp "$GITHUB_WORKSPACE"/ophub/openwrt/out/*.img* "$DEST/" || exit 1
              ;;
            nanopi-r3s)
              # rockchip target 产物: Device/Default IMAGES := sysupgrade.img.gz (rk3566 pine64-img bootflow)
              cp bin/targets/rockchip/armv8/*nanopi-r3s*sysupgrade.img* "$DEST/" || exit 1
              ;;
            *)
              echo "ERROR: unknown device ${DEVICE}" && exit 1
              ;;
          esac
          echo "=== 精选固件列表 ==="
          ls -lh "$DEST"
          echo "FILES=$(ls "$DEST" | tr '\n' ',')" >> "$GITHUB_OUTPUT"

      - name: Upload firmware (for release)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.dev.outputs.DEVICE }}
          path: firmware/
          if-no-files-found: error

      - name: Upload full build output
        run: |
          cd openwrt
          # full bin 归档单独一份 (不参与 release, 供下载完整产物)
          mkdir -p "$GITHUB_WORKSPACE/bin-archive"
          cp -r bin "$GITHUB_WORKSPACE/bin-archive/bin"
        env:
          DEVICE: ${{ steps.dev.outputs.DEVICE }}
      - name: Upload full build archive
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-bin-${{ steps.dev.outputs.DEVICE }}-${{ github.run_id }}
          path: bin-archive/
          if-no-files-found: warn

      - name: Collect build logs
        if: failure()
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/logs"
          find build_dir -name '*.log' -exec cp {} "$GITHUB_WORKSPACE/logs/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/logs" 2>/dev/null || true
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-logs-${{ steps.dev.outputs.DEVICE }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

  # 统一 Release: 汇总所有平台固件到同一个 release (参考 immutablewrt_yzx)
  release:
    needs: [build]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate release tag
        id: tag
        run: |
          IMMORTALWRTTAG="${{ github.event.inputs.tag || 'v25.12.2' }}"
          BUILD_TAG="$(date +%Y%m%d-%H%M)"
          RELEASE_TAG="ImmortalWrt-${IMMORTALWRTTAG#v}-${BUILD_TAG}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release tag: ${RELEASE_TAG}"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: ./all-firmware
          merge-multiple: false

      - name: Gather firmware files
        run: |
          mkdir -p release-files
          find ./all-firmware -type f \( -name '*.bin' -o -name '*.itb' -o -name '*.img.gz' -o -name '*.img' -o -name '*rootfs.tar.gz' \) | while read file; do
            cp "$file" release-files/
          done
          echo "=== 准备发布的固件列表 ==="
          ls -lh release-files/

      - name: Compute SHA256 checksums
        run: |
          cd release-files
          sha256sum * > checksums.txt
          echo "=== checksums.txt ==="
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body: |
            ImmortalWrt 多机型固件统一发布。

            - 上游版本: `${{ github.event.inputs.tag || 'v25.12.2' }}`
            - 构建时间: `${{ steps.tag.outputs.release_tag }}`
            - 机型: mt3000 / tr3000 / x86-64 / lubancat-1
          files: release-files/*
