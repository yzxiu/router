# blacklist-brnetfilter — 阻止 br_netfilter 模块自动加载
#
# 根因 (2026-10-03 LubanCat-1 实机): br_netfilter 与 TPROXY 透明代理在
# bridge 上下文中冲突 —— 桥转发包被提前拉进 netfilter 后, tproxy verdict
# 接管的 TCP 包静默丢弃 (sing-box 旁路由 TCP 全卡), 详见:
#   /etc/sysctl.d/99-disable-brnetfilter.conf
#
# Docker 默认会加载此模块; 本机 Docker 已配置 bridge=none + iptables=false,
# 单机 host 网络用法不依赖它。blacklist 阻止 modprobe 自动加载;
# 如确需临时启用: modprobe br_netfilter (显式加载不受 blacklist 限制)。

blacklist br_netfilter
