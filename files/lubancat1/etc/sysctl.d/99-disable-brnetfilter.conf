# 99-disable-brnetfilter.conf — 关闭 br_netfilter 对 iptables 的桥劫持
#
# 背景 (2026-10-03 LubanCat-1 实机排查结论):
#   Docker 运行时会加载 br_netfilter 模块, 使 br-lan 桥上转发的包也被
#   拉进 netfilter PREROUTING。sing-box 的 TPROXY 规则在 bridge 上下文中
#   接管 TCP 连接后, 包无法经策略路由(fwmark->table 100->lo)送回监听
#   socket, 被静默丢弃 —— 表现为"旁路由 TCP 全部卡死"(SYN_SENT packets=1
#   无重传, tcpdump 抓不到, sing-box 零日志), 而 ICMP/UDP 不受影响。
#
#   卸载 br_netfilter 后 TCP tproxy 立即恢复 (实测 baidu 200)。
#   同期对照机 NanoPi R3S (op4) 未加载此模块, 相同配置一直正常。
#
# 本机 Docker 已配置 bridge=none/iptables=false (见 /etc/docker/daemon.json),
# 不依赖 br_netfilter, 关闭无副作用。
#
# 模块本体由 /etc/modprobe.d/blacklist-brnetfilter.conf 阻止自动加载;
# 本文件在模块万一被其他途径加载时兜底 (sysctl 优先级 99, 开机即生效)。

# IPv4: 桥上流量不送 iptables
net.bridge.bridge-nf-call-iptables = 0

# IPv6: 桥上流量不送 ip6tables
net.bridge.bridge-nf-call-ip6tables = 0

# ARP: 桥上 ARP 不送 arptables
net.bridge.bridge-nf-call-arptables = 0
