# platforms.conf — 平台层声明
# 决定要编译哪些设备 + 各设备参数 (target/subtarget/设备profile/CI runner)
# 格式: 每行一条, 空格分隔
#   <device> <target_board> <target_subtarget> <device_profile> <runner>
#   device_profile 留 "-" 表示无专属 profile (如 x86/64、armsr/armv8 走通用)
#
# 该文件是 CI matrix 与 generate-config.sh target 映射的唯一来源。
# 增删平台 = 在这里加/删一行, 无需改 workflow 逻辑。

mt3000   mediatek filogic glinet_gl-mt3000        ubuntu-22.04
tr3000   mediatek filogic cudy_tr3000-v1-ubootmod ubuntu-22.04
x86-64   x86      64      -                      ubuntu-22.04
lubancat armsr    armv8   -                      ubuntu-24.04
