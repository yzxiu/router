# radxa-a5e 平台专用软件配置
# 语法: +CONFIG_PACKAGE_<name>=y 附加 / -CONFIG_PACKAGE_<name> 排除
#
# ============================================================
# 本平台定位: 纯 armsr/armv8 官方 rootfs, 不封装可刷 .img
#   (不做 ophub remake, 后续用 rootfs.tar.gz 构建 docker 镜像)
#   因此只需产出 rootfs.tar.gz (CONFIG_TARGET_ROOTFS_TARGZ=y),
#   rootfs.tar.gz 可直接 docker import 作为基础层。
#   (对比 lubancat1: 该平台走 ophub remake 封装成可刷 .img, 需要 fdisk/parted/docker 等)
# ============================================================
# 无线/WiFi 客户端 + AP (用于 LuCI 里连接 WiFi / 配置无线):
#   wpad-mesh-mbedtls: 同时提供 wpa-supplicant(客户端) + hostapd(AP),
#                       WPA-PSK/SAE(WPA3)/11r/11w, mbedTLS 密码库后端;
#                       LuCI 里"加入 WiFi(客户端)"或"开热点"都靠它
#                       (wpad-mesh 系列三变体 mbedtls/openssl/wolfssl 互斥, 选 mbedTLS;
#                        与设备/armsr 默认固件一致 — 实机已预装 wpad-mesh-mbedtls)
#   hostapd-common: wpad 共享配置/脚本 (wpad 自动依赖)
#   libiwinfo: 无线接口信息库 (无线 API 依赖)
#   rpcd-mod-iwinfo: rpcd 的 iwinfo 插件 (LuCI 无线状态页依赖), 自动依赖 libiwinfo
#   (注: 不用 hostapd-basic-mbedtls — 它只做 AP 端、不能当 WiFi 客户端;
#        不装多个 wpad/hostapd 变体 — 它们 PROVIDES 同名 CONFLICTS 互斥, 一次只能一个)
+CONFIG_PACKAGE_wpad-mesh-mbedtls=y
+CONFIG_PACKAGE_hostapd-common=y
+CONFIG_PACKAGE_libiwinfo=y
+CONFIG_PACKAGE_rpcd-mod-iwinfo=y
# ============================================================
# LuCI (Web 管理界面 + 网络页 + 中文)
#   luci: LuCI 主程序 (meta, 带默认页面集合)
#   luci-mod-network: 网络配置页 (接口/无线等)
#   luci-i18n-base-zh-cn: base 中文语言包
#   (注: 平台层加包须带 + 前缀; 裸 CONFIG_PACKAGE_* 会被当 raw 透传, 不参与包列表/排除)
+CONFIG_PACKAGE_luci=y
+CONFIG_PACKAGE_luci-mod-network=y
+CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
# ============================================================
# 首启分区 + 双槽 OTA 升级 依赖工具 (与 lubancat1 同款, ophub remake 注入的
#   openwrt-install-amlogic / openwrt-update-rockchip 脚本运行时依赖)
#   依据: scripts 源码 command -v 实证 (luci-app-amlogic root/usr/sbin, remake 注入)
# ============================================================
# --- A. 磁盘/分区工具 (首启 install 重写 eMMC 分区表 + update 挂载/切槽) ---
# fdisk: install 重写分区表; lsblk: 定位 eMMC/根分区
# uuidgen: 生成 btrfs 双 rootfs 槽位 UUID; losetup: update 挂载固件镜像到 loop
# parted: update 在线增删 OTA 分区; dosfstools: mkfs.fat 建 FAT32 BOOT 分区
# xfs-mkfs / btrfs / f2fs: 格式化新槽位 (btrfs 主, xfs/f2fs 可选)
+CONFIG_PACKAGE_fdisk=y
+CONFIG_PACKAGE_lsblk=y
+CONFIG_PACKAGE_uuidgen=y
+CONFIG_PACKAGE_losetup=y
+CONFIG_PACKAGE_parted=y
+CONFIG_PACKAGE_dosfstools=y
+CONFIG_PACKAGE_xfs-mkfs=y
+CONFIG_PACKAGE_btrfs-progs=y
+CONFIG_PACKAGE_f2fs-tools=y
# --- B. 压缩/解压 (update 解固件包) ---
# bsdtar: 解 .img.gz; unzip: 手动上传 zip 固件; xz-utils: 解 .img.xz
# zstd: 解 .tar.zst; pigz: 多线程 gzip 加速 ddbr 备份
+CONFIG_PACKAGE_bsdtar=y
+CONFIG_PACKAGE_unzip=y
+CONFIG_PACKAGE_xz-utils=y
+CONFIG_PACKAGE_zstd=y
+CONFIG_PACKAGE_pigz=y
# --- C. 脚本解释/工具 ---
# jq: 读 daemon.json 与 firmware JSON; gawk: awk 增强; pv: 进度条
# coreutils(+nohup): 标准工具补全
+CONFIG_PACKAGE_jq=y
+CONFIG_PACKAGE_gawk=y
+CONFIG_PACKAGE_pv=y
+CONFIG_PACKAGE_coreutils=y
+CONFIG_PACKAGE_coreutils-nohup=y
# ============================================================
# 平台专用 raw CONFIG 选项 (generate-config.sh 平台层透传支持):
#   - TARGZ: 产出 rootfs.tar.gz (用于 docker import 构建镜像)
#   - ROOTFS_PARTSIZE: armsr 默认 rootfs 大小 (LuCI + hostapd 使略膨胀, 给 512MB 余量)
CONFIG_TARGET_ROOTFS_TARGZ=y
CONFIG_TARGET_ROOTFS_PARTSIZE=512
