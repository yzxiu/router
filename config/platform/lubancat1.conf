# lubancat 平台专用软件配置
# 语法: +CONFIG_PACKAGE_<name>=y 附加 / -CONFIG_PACKAGE_<name> 排除
#
# ============================================================
# Docker 容器运行时 (lubancat 专用)
#   dockerd 29.6.1 + docker CLI 29.6.1 + docker-compose 5.1.4 (CLI 插件)
#   依赖自动带入: containerd/runc/tini + kmod-veth/kmod-nf-ipvs/kmod-macvlan
#   + DOCKER_CGROUP_OPTIONS/DOCKER_NET_MACVLAN/DOCKER_STO_EXT4 自动生效
#   存储: overlay2 驱动 (内核 OVERLAY_FS 默认编入), ext4 后端, 无需额外配置
# ============================================================
# ophub 安装/更新脚本 (luci-app-amlogic 服务端) 运行期依赖
#   依据来源: ophub/amlogic-s9xxx-openwrt documents/README.md §10.11 Required Options
#   + luci-app-amlogic openwrt-install-amlogic / openwrt-update-amlogic 实际调用命令
#   (2026-09-27 LubanCat-1 实机 command -v + 脚本 2849 行源码交叉核对)
#   缺失后果: install 在 fdisk/mkfs.fat 失败; update 在 parted/losetup/unzip 中断
#
# --- A. 磁盘/分区工具 (install/update 脚本直接调用, 缺则脚本中断) ---
# fdisk: install 重写 eMMC 分区表 (脚本 275-403 行); lsblk: 定位 eMMC/根分区 (23 处)
# uuidgen: 生成 btrfs 双 rootfs 槽位 UUID (/usr/bin/uuidgen, 脚本 488-495 行)
# losetup: update 挂载固件镜像到 loop (脚本 955-1018 行)
# parted: update 在线增删 OTA 分区 (rm/mkpart, 脚本 1156-1160 行)
+CONFIG_PACKAGE_fdisk=y
+CONFIG_PACKAGE_lsblk=y
+CONFIG_PACKAGE_uuidgen=y
+CONFIG_PACKAGE_losetup=y
+CONFIG_PACKAGE_parted=y
# dosfstools: mkfs.fat 建 FAT32 BOOT 分区 (脚本 482 行); xfs-mkfs: 选 xfs 共享分区时 mkfs.xfs
#   (mkfs.ext4/mkfs.btrfs/mkfs.f2fs/btrfs/blkid/fatlabel 设备已有, 无需重复加)
+CONFIG_PACKAGE_dosfstools=y
+CONFIG_PACKAGE_xfs-mkfs=y
#
# --- B. 压缩/解压 (update 解固件包; 10.11 Compression 区钦定) ---
# bsdtar: 解 .img.gz (脚本 852 行); unzip: 手动上传 zip 固件 (脚本 858 行)
# xz-utils: 提供 xz 命令解 .img.xz (脚本 842 行); zstd: 解 .tar.zst 固件 (10.11 钦定)
# pigz: 多线程 gzip 加速 ddbr 备份 (10.11 钦定)
#   (xz 命令由 meta 包 xz-utils 提供; 单独 CONFIG_PACKAGE_xz 在 defconfig 会被裁剪)
+CONFIG_PACKAGE_bsdtar=y
+CONFIG_PACKAGE_unzip=y
+CONFIG_PACKAGE_xz-utils=y
+CONFIG_PACKAGE_zstd=y
+CONFIG_PACKAGE_pigz=y
#
# --- C. 脚本解释/工具 (10.11 钦定 + 修复登录报错) ---
# perl 全家: ophub sysinfo (getcpu/cpustat/7z) 与 balethirq 中断均衡均 #!/usr/bin/env perl
#   -> 缺 perl 正是登录时 "env: can't execute 'perl'" 报错的根因; 按 10.11 Perl 区钦定子集
# jq: 读 /etc/docker/daemon.json 与 firmware JSON (脚本 1041-1047 行, 可选但钦定)
# gawk: awk 增强 (脚本大量 awk 管道); pv: ddbr 备份/恢复进度条 (脚本 2308-2317 行)
# coreutils(+nohup): 10.11 System 区钦定, 提供标准工具补全
+CONFIG_PACKAGE_perl=y
+CONFIG_PACKAGE_perlbase-file=y
+CONFIG_PACKAGE_perlbase-getopt=y
+CONFIG_PACKAGE_perlbase-time=y
+CONFIG_PACKAGE_perlbase-unicode=y
+CONFIG_PACKAGE_perlbase-utf8=y
+CONFIG_PACKAGE_perl-http-date=y
+CONFIG_PACKAGE_jq=y
+CONFIG_PACKAGE_gawk=y
+CONFIG_PACKAGE_pv=y
+CONFIG_PACKAGE_coreutils=y
+CONFIG_PACKAGE_coreutils-nohup=y
#
# ============================================================
# 平台专用 raw CONFIG 选项 (generate-config.sh 平台层透传支持):
#   - rootfs ext4 镜像 768MB: docker + ophub amlogic 依赖使 rootfs 膨胀,
#     384MB 仍可能溢出 (参考 x86 384 溢出缺~11MB 的先例), 直接给足余量
CONFIG_TARGET_ROOTFS_PARTSIZE=768
+CONFIG_PACKAGE_dockerd=y
+CONFIG_PACKAGE_docker=y
+CONFIG_PACKAGE_docker-compose=y
# ============================================================
# 晶晨宝盒 (luci-app-amlogic / Amlogic Service) — LubanCat UI 面板
#   来源: feeds.conf 里 ophub src-git 第三方源 (锁 commit 8fe2b60, main@3.1.321-r2)
#   JS 版, 适配 ImmortalWrt 25.12 新 LuCI; 仅本平台选装
#   依赖 (fdisk/lsblk/uuidgen/losetup/parted/dosfstools/jq/pv/perl/blkid 等)
#   已在上方 A/B/C 组补齐, 由 LUCI_DEPENDS 自动闭环
+CONFIG_PACKAGE_luci-app-amlogic=y
+CONFIG_PACKAGE_luci-i18n-amlogic-zh-cn=y

# stress-ng: CPU/内存/IO 压测工具 (测双槽 OTA 的"探针包": 升级后若还在/能跑, 证明配置与软件随槽迁移正常; 也用它给风扇加负载)
#   包实体名 stress-ng (feeds/packages/utils/stress-ng), 已实证 .config 存在 CONFIG_PACKAGE_stress-ng 符号
#   (注: 该包 PROVIDES:=stress 只是虚拟依赖名, 用 CONFIG_PACKAGE_stress=y 不会生效, 必须用 stress-ng)
CONFIG_PACKAGE_stress-ng=y