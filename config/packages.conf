# packages.conf — 通用软件需求层
# 这里列出的 CONFIG_PACKAGE_* 会应用到【所有平台】(作为通用基础软件包)。
# 格式: 一行一个, 必须是 OpenWrt config 片段
#   CONFIG_PACKAGE_<name>=y
#
# 平台专用软件 (只某个平台要的包, 如 lubancat 的 luci-app-amlogic 晶晨宝盒)
# 放 config/platform/<device>.conf, 见该目录说明。
#
# 说明: 全部走官方默认版本软件 (包定制后续再调)。仅维护确需的通用包。
# adguardhome 全平台不用 (不在本清单)。

# 通用基础工具: resolveip (主机名解析为 IP 的命令行工具, 供脚本用)
CONFIG_PACKAGE_resolveip=y

