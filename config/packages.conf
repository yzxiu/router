# ============================================================
# packages.conf — 通用软件需求层 (所有平台统一安装)
# ============================================================
# 蓝本: immortalwrt_yzx 的 myconfig(54 包 + 14 功能选项)
# 版本: 全部使用官方源默认版本 (不做 yzx 的自定义 feeds 升版)
# 语法: CONFIG_PACKAGE_<name>=y  表示安装该包
#       其他 CONFIG_* 行(如 LIBCURL/BUSYBOX 子功能) 原样透传到 .config
# 平台差异(排除/附加): 放 config/platform/<device>.conf, 不要写在这里
#   平台层语法: +CONFIG_PACKAGE_<name>=y 附加 / -CONFIG_PACKAGE_<name> 排除
# 变更记录:
#   v1 (57de0e7): 仅 resolveip (过渡)
#   v2 (5141974): 补全 yzx 全套 25 包 + 14 功能选项
# ============================================================

# ------------------------------------------------------------
# 1. 代理 / VPN 客户端
# ------------------------------------------------------------
# sing-box: 通用代理内核 (支持 V2Ray/Xray/Hysteria/Trojan/TUIC 等, 兼容 sing-box 协议)
CONFIG_PACKAGE_sing-box=y
# nebula: Slack 开源的轻量 overlay 组网 (加密 mesh VPN, 走 UDP 445/38001)
CONFIG_PACKAGE_nebula=y
# gost: Go 实现的多协议隧道/代理 (兼容 HTTP/SOCKS5/SS/Forwarder 等)
CONFIG_PACKAGE_gost=y
# udp2raw: UDP 伪装成 TCP 隧道 (用于绕过 QoS/封 UDP 的运营商)
CONFIG_PACKAGE_udp2raw=y

# ------------------------------------------------------------
# 2. WireGuard VPN (内核级加密隧道)
# ------------------------------------------------------------
# 用户态工具: wg 命令行 (配置/管理 peer、密钥)
CONFIG_PACKAGE_wireguard-tools=y
# LuCI 界面: OpenWrt 网络->接口 里新增 WireGuard 协议类型 (Web 配置入口)
CONFIG_PACKAGE_luci-proto-wireguard=y
# 内核模块: WireGuard 内核实现 (数据面)
CONFIG_PACKAGE_kmod-wireguard=y
# 以下 kmod 均为 WireGuard 所需的依赖:
#   tun: 虚拟网卡设备 (隧道/代理均依赖)
CONFIG_PACKAGE_kmod-tun=y
#   udptunnel4/udptunnel6: IPv4/IPv6 UDP 隧道封装
CONFIG_PACKAGE_kmod-udptunnel4=y
CONFIG_PACKAGE_kmod-udptunnel6=y
#   crypto-kpp: 内核 Key-agreement Protocol Primitives (curve25519 协商用)
CONFIG_PACKAGE_kmod-crypto-kpp=y
#   crypto-lib-curve25519: 椭圆曲线 X25519 算法库 (WG 密钥交换)
CONFIG_PACKAGE_kmod-crypto-lib-curve25519=y
#   crypto-lib-chacha20: ChaCha20 流密码 (WG 加密)
CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y
#   crypto-lib-chacha20poly1305: ChaCha20-Poly1305 AEAD (WG 数据加密/完整性)
CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y
#   crypto-lib-poly1305: Poly1305 MAC 算法库 (WG 完整性)
CONFIG_PACKAGE_kmod-crypto-lib-poly1305=y

# ------------------------------------------------------------
# 3. 工具 / Shell
# ------------------------------------------------------------
# resolveip: 主机名 -> IP 解析工具 (OpenWrt 官方 net/resolveip, 供脚本取 IP)
CONFIG_PACKAGE_resolveip=y
# bash: Bourne-Again Shell (比默认 ash 功能全)
CONFIG_PACKAGE_bash=y
# curl: 命令行 HTTP 客户端 (配合下面 libcurl 功能选项)
CONFIG_PACKAGE_curl=y
# sudo: 提权执行 (非 root 用户管理用)
CONFIG_PACKAGE_sudo=y
# terminfo: 终端能力数据库 (bash/readline 等依赖)
CONFIG_PACKAGE_terminfo=y

# ------------------------------------------------------------
# 4. 运行库 (C/C++ 依赖)
# ------------------------------------------------------------
# libatomic: GCC 原子操作库 (C++11 原子/自旋锁)
CONFIG_PACKAGE_libatomic=y
# libstdcpp: GNU C++ 标准库 (C++ 程序依赖)
CONFIG_PACKAGE_libstdcpp=y
# libncurses: 终端交互界面库 (screen/top/readline 依赖)
CONFIG_PACKAGE_libncurses=y
# libreadline: 命令行编辑/补全库 (bash 交互)
CONFIG_PACKAGE_libreadline=y
# libcurl: curl 的库本体 (内含下面 LIBCURL 各功能开关)
CONFIG_PACKAGE_libcurl=y
# 注: libusb-1.0 是 usb 工具(usb-modeswitch 等)的被动依赖, 不主动列出
#     (主动选 defconfig 时也会被 fold); 需要时由依赖包自动带上 + 平台层按需

# ============================================================
# 功能选项 (非独立包, 组件子功能开关, 原样透传)
# ============================================================

# ------------------------------------------------------------
# 5. BusyBox: 启用 nohup (后台运行不挂断)
# ------------------------------------------------------------
CONFIG_BUSYBOX_CUSTOM=y
CONFIG_BUSYBOX_CONFIG_NOHUP=y

# ------------------------------------------------------------
# 6. libcurl 功能集 (让 curl/sing-box 等支持完整协议)
# ------------------------------------------------------------
CONFIG_LIBCURL_COOKIES=y           # Cookie 支持 (会话/登录)
CONFIG_LIBCURL_CRYPTO_AUTH=y       # 加密认证 (摘要/加密握手)
CONFIG_LIBCURL_FILE=y              # file:// 本地文件协议
CONFIG_LIBCURL_FTP=y               # FTP 协议
CONFIG_LIBCURL_HTTP=y              # HTTP/1.1
CONFIG_LIBCURL_NGHTTP2=y           # HTTP/2 (需 nghttp2 库, defconfig 依赖不足时会自动关)
CONFIG_LIBCURL_OPENSSL=y           # OpenSSL/TLS 加密
CONFIG_LIBCURL_PROXY=y             # HTTP/HTTPS 代理支持
CONFIG_LIBCURL_TFTP=y              # TFTP 协议
CONFIG_LIBCURL_THREADED_RESOLVER=y # 多线程 DNS 解析
CONFIG_LIBCURL_TLS_SRP=y           # TLS-SRP (用户名+密码 TLS 认证)
CONFIG_LIBCURL_UNIX_SOCKETS=y      # Unix 域套接字传输
